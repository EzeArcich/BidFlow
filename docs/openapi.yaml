components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum obtenido de POST /auth/login. Caduca a las 8 horas y se revoca con /auth/logout.
  parameters:
    Organization:
      name: X-Organization-ID
      in: header
      required: false
      description: Selector de organización. Se valida la membresía autenticada y estado activo. Obligatorio si
        el usuario pertenece a más de una organización activa. Nunca se toma organization_id del body como autorización.
      schema: &id005
        type: string
        pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
        example: 01M6S46AMG6NY6YXMJV6FADVK1
    Tender:
      name: tender
      in: path
      required: true
      schema: *id005
    Item:
      name: item
      in: path
      required: true
      schema: *id005
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Busca por título de RFQ o nombre legal/comercial de proveedor (ILIKE).
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Portalorganization:
      name: organization
      in: path
      required: true
      schema: *id004
    Portalinvitation:
      name: invitation
      in: path
      required: true
      schema: *id004
    PortalworkOrder:
      name: workOrder
      in: path
      required: true
      schema: *id004
  responses:
    Unauthorized:
      description: Token ausente, inválido, expirado o credenciales incorrectas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Token ausente, inválido, expirado o credenciales incorrectas.
    Forbidden:
      description: Sin membresía activa, rol o capacidad de token requerida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Sin membresía activa, rol o capacidad de token requerida.
    NotFound:
      description: Recurso inexistente, de otra organización o ítem de otra licitación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Recurso inexistente, de otra organización o ítem de otra licitación.
    Conflict:
      description: La licitación no es un borrador o el ítem tiene dependencias.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: La licitación no es un borrador o el ítem tiene dependencias.
    ValidationError:
      description: Payload o precondiciones inválidos; incluye errors por campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: The given data was invalid.
            errors:
              items:
              - Add at least one item before publication.
    RateLimited:
      description: Límite de intentos de login alcanzado; respetar Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Límite de intentos de login alcanzado; respetar Retry-After.
  schemas:
    Tender:
      type: object
      properties:
        id: *id005
        organization_id: *id005
        type: *id006
        status: *id007
        title:
          type: string
          maxLength: 255
        description: &id009
          type:
          - string
          - 'null'
        currency:
          type: string
          const: ARS
        deadline_at: *id008
        conditions: &id010
          type:
          - object
          - array
          - 'null'
          description: Especificaciones o condiciones JSON, máximo 100 elementos en el primer nivel.
          maxProperties: 100
          maxItems: 100
        source_system: *id009
        external_reference: *id009
        created_by: *id005
        is_demo:
          type: boolean
        created_at: *id008
        updated_at: *id008
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
      required:
      - id
      - organization_id
      - type
      - status
      - title
      - currency
      - deadline_at
    Item:
      type: object
      properties:
        id: *id005
        tender_id: *id005
        position:
          type: integer
          minimum: 1
        description:
          type: string
        unit:
          type: string
        quantity:
          type: string
          pattern: ^\d+\.\d{3}$
          example: '1.250'
        attributes: *id010
        reference_code: *id009
        notes: *id009
      required:
      - id
      - tender_id
      - position
      - description
      - unit
      - quantity
    Invitation:
      type: object
      properties:
        id: *id005
        tender_id: *id005
        supplier_id: *id005
        contact_id:
          anyOf:
          - *id005
          - type: 'null'
        status:
          type: string
          enum:
          - pending
          - sent
          - viewed
          - responded
          - declined
          - expired
          - revoked
        expires_at: *id008
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - tender_id
      - supplier_id
      - status
      - expires_at
    Supplier:
      type: object
      properties:
        id: *id005
        type:
          type: string
          enum:
          - vendor
          - contractor
          - parts
          - workshop
          - mixed
        legal_name:
          type: string
        trade_name:
          type: string
        is_demo:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            type: object
            properties:
              id: *id005
              name:
                type: string
              email:
                type: string
                format: email
            required:
            - id
            - name
            - email
      required:
      - id
      - type
      - legal_name
      - trade_name
    User:
      type: object
      properties:
        id: *id005
        name:
          type: string
        email:
          type: string
          format: email
        organizations:
          type: array
          items:
            type: object
            properties:
              id: *id005
              name:
                type: string
              role:
                type: string
                enum:
                - owner
                - admin
                - operator
                - viewer
              status:
                type: string
                enum:
                - active
                - inactive
            required:
            - id
            - name
            - role
            - status
      required:
      - id
      - name
      - email
      - organizations
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 1024
          writeOnly: true
        device_name:
          type: string
          maxLength: 100
      required:
      - email
      - password
      - device_name
    CreateTender:
      type: object
      properties: &id011
        id: false
        organization_id: false
        created_by: false
        status: false
        is_demo: false
        repair_scope: false
        tender_id: false
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum:
          - products
          - services
          - works
        description:
          type:
          - string
          - 'null'
          maxLength: 10000
        currency:
          type: string
          const: ARS
          default: ARS
        deadline_at:
          type: string
          format: date-time
          example: '2026-12-01T18:00:00Z'
          description: Fecha ISO8601 futura, con Z u offset explícito; se normaliza a UTC.
        conditions: *id010
        source_system:
          type:
          - string
          - 'null'
          maxLength: 255
        external_reference:
          type:
          - string
          - 'null'
          maxLength: 255
        items: false
      required:
      - title
      - type
      - deadline_at
    UpdateTender:
      type: object
      properties: *id011
    CreateItem:
      type: object
      properties: &id012
        id: false
        organization_id: false
        created_by: false
        status: false
        is_demo: false
        repair_scope: false
        tender_id: false
        description:
          type: string
          minLength: 1
          maxLength: 10000
        unit:
          type: string
          minLength: 1
          maxLength: 50
        quantity:
          type: string
          pattern: ^(?:0|[1-9][0-9]{0,8})(?:\.[0-9]{1,3})?$
          description: Decimal positivo como string; máximo 9 enteros y 3 decimales. No se aceptan números JSON
            ni cero.
          example: '1.250'
          not:
            pattern: ^0(?:\.0+)?$
        position:
          type: integer
          minimum: 1
          maximum: 2147483647
        attributes: *id010
        reference_code:
          type:
          - string
          - 'null'
          maxLength: 255
        notes:
          type:
          - string
          - 'null'
          maxLength: 10000
      required:
      - description
      - unit
      - quantity
    UpdateItem:
      type: object
      properties: *id012
    InviteSuppliers:
      type: object
      properties:
        id: false
        organization_id: false
        created_by: false
        status: false
        is_demo: false
        repair_scope: false
        tender_id: false
        invitations:
          type: array
          minItems: 1
          maxItems: 100
          description: supplier_id debe ser distinto dentro de un mismo lote.
          items:
            type: object
            properties:
              supplier_id: *id005
              contact_id:
                anyOf:
                - *id005
                - type: 'null'
            required:
            - supplier_id
            additionalProperties: false
      required:
      - invitations
    SaveBid:
      type: object
      properties:
        currency:
          type: string
          enum:
          - ARS
        conditions:
          type:
          - string
          - 'null'
        warranty:
          type:
          - string
          - 'null'
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            properties:
              tender_item_id: *id004
              quantity: &id014
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,8})(?:\.[0-9]{1,3})?$
                example: '60.000'
                description: Decimal positivo; hasta 9 enteros y 3 decimales.
              unit_price: &id013
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,12})(?:\.[0-9]{1,2})?$
                example: '1000.00'
              delivery_days: &id015
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 3650
              conditions: &id016
                type:
                - string
                - 'null'
                maxLength: 10000
              notes: &id017
                type:
                - string
                - 'null'
                maxLength: 10000
            required:
            - tender_item_id
            - quantity
            - unit_price
            additionalProperties: false
      required:
      - lines
    Bid:
      type: object
      properties:
        id: *id004
        tender_id: *id004
        supplier_id: *id004
        invitation_id: *id004
        status:
          type: string
          enum:
          - draft
          - submitted
          - accepted
          - rejected
        currency:
          const: ARS
        total_amount: *id013
        conditions:
          type:
          - string
          - 'null'
        warranty:
          type:
          - string
          - 'null'
        submitted_snapshot:
          type:
          - object
          - 'null'
        lines:
          type: array
          items:
            type: object
            properties:
              id: *id004
              tender_item_id: *id004
              quantity: *id014
              unit_price: *id013
              delivery_days: *id015
              conditions: *id016
              notes: *id017
              description: *id004
              subtotal: *id013
    AllocateAward:
      type: object
      properties:
        request_key:
          type: string
          maxLength: 100
          description: Alternativa al header Idempotency-Key; si se envía header tiene prioridad.
        reason:
          type: string
          maxLength: 10000
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            properties:
              bid_item_id: *id004
              quantity: *id014
              unit_price: *id013
              notes:
                type:
                - string
                - 'null'
            required:
            - bid_item_id
            - quantity
            - unit_price
      required:
      - request_key
      - reason
      - lines
    AwardLine:
