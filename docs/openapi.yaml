        bid_id: *id004
        bid_item_id: *id004
        tender_item_id: *id004
        supplier_id: *id004
        quantity: *id014
        unit_price: *id013
        subtotal: *id013
        currency:
          const: ARS
        snapshot:
          type: object
        notes:
          type:
          - string
          - 'null'
    WorkOrder:
      type: object
      properties:
        id: *id004
        number: *id004
        award_id: *id004
        tender_id: *id004
        supplier_id: *id004
        status: *id004
        total_amount: *id013
        lines:
          type: array
          items:
