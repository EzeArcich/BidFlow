        tender_id: *id004
        status: *id004
        currency:
          const: ARS
        items:
          type: array
          items:
            type: object
            properties:
              id: *id004
              description: *id004
              unit: *id004
              requested_quantity: *id014
              awarded_quantity: *id004
              pending_quantity: *id004
              quotes:
                type: array
                items:
                  type: object
                  properties:
                    bid_id: *id004
                    bid_item_id: *id004
                    supplier_id: *id004
                    supplier_name: *id004
                    quantity: *id014
                    unit_price: *id013
                    subtotal: *id013
                    delivery_days:
                      type:
                      - integer
                      - 'null'
                    conditions:
                      type:
                      - string
                      - 'null'
