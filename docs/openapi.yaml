openapi: 3.1.0
info:
  title: Bidflow API
  version: 0.3.0
  description: SaaS B2B genérico. RFQ, portal proveedor, ofertas parciales, evaluación, adjudicación distribuida
    y órdenes. Dinero decimal ARS. Idempotency-Key en adjudicación; no aplica globalmente. Sin correo, pagos ni
    logística.
servers:
- url: http://localhost:8080/api/v1
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Emitir token de usuario
      tags:
      - Autenticación
      description: 'Sanctum Bearer: token con hash en DB y vigencia de 8 horas. Se muestra sólo al emitirlo. No
        requiere membresía para autenticar. Límite 5 intentos/minuto por IP+email y 20 por IP. Sin registro público
        ni refresh token.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_at: &id008
                    type: string
                    format: date-time
                    example: '2026-12-01T18:00:00Z'
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - access_token
                - token_type
                - expires_at
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /auth/me:
    get:
      operationId: currentUser
      summary: Consultar usuario y membresías
      tags:
      - Autenticación
      description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revocar sólo el token actual
      tags:
      - Autenticación
      description: ''
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tenders:
    get:
      operationId: listTenders
      summary: Listar RFQ propias
      tags:
      - RFQ
      description: ' Requiere rfq:read; todos los roles pueden consultar.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tender'
                  links:
                    type: object
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - &id001
        $ref: '#/components/parameters/Search'
      - &id002
        $ref: '#/components/parameters/PerPage'
      - &id003
        $ref: '#/components/parameters/Page'
      - name: status
        in: query
        schema: &id007
          type: string
          enum:
          - draft
          - published
          - closed
          - partially_awarded
          - awarded
          - completed
          - cancelled
          - expired
      - name: type
        in: query
        schema: &id006
          type: string
          enum:
          - products
          - services
          - works
          - parts
          - repair
    post:
      operationId: createTender
      summary: Crear borrador
      tags:
      - RFQ
      description: Ítems e invitaciones se agregan con sus endpoints separados. Estado, creador y organización los
        establece el servidor. Requiere rfq:read y rfq:write y rol owner/admin/operator.
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tender'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - $ref: '#/components/parameters/Organization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTender'
  /tenders/{tender}:
    get:
      operationId: showTender
      summary: Detalle de RFQ con ítems e invitaciones
      tags:
      - RFQ
      description: ' Requiere rfq:read; todos los roles pueden consultar.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tender'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
    patch:
      operationId: updateTender
      summary: Editar borrador
      tags:
      - RFQ
      description: Sólo draft. Un nuevo deadline sincroniza el vencimiento de sus invitaciones. Tipos legacy se
        pueden consultar y editar sin convertirlos; la API sólo asigna tipos genéricos. Si la clasificación tiene
        registros dependientes que impiden cambiarla retorna 409. Requiere rfq:read y rfq:write y rol owner/admin/operator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tender'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTender'
  /tenders/{tender}/items:
    get:
      operationId: listItems
      summary: Listar ítems ordenados por posición
      tags:
      - RFQ
      description: ' Requiere rfq:read; todos los roles pueden consultar.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
    post:
      operationId: createItem
      summary: Agregar ítem
      tags:
      - RFQ
      description: Sólo draft. Si se omite position se asigna la siguiente libre al final. attributes contiene especificaciones
        genéricas. Requiere rfq:read y rfq:write y rol owner/admin/operator.
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItem'
  /tenders/{tender}/items/{item}:
    patch:
      operationId: updateItem
      summary: Editar ítem
      tags:
      - RFQ
      description: El ítem debe pertenecer a la RFQ de la ruta. Posiciones duplicadas retornan 422. Requiere rfq:read
        y rfq:write y rol owner/admin/operator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
      - $ref: '#/components/parameters/Item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItem'
    delete:
      operationId: deleteItem
      summary: Eliminar ítem de borrador
      tags:
      - RFQ
      description: Rechaza ítems referenciados por ofertas o adjuntos con 409. Requiere rfq:read y rfq:write y rol
        owner/admin/operator.
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
      - $ref: '#/components/parameters/Item'
  /suppliers:
    get:
      operationId: listSuppliers
      summary: Buscar proveedores disponibles
      tags:
      - Proveedores
      description: Sólo proveedores y vínculos activos de la organización, sin filtro sectorial. Incluye contactos
        y capacidades de la red compartida. Requiere rfq:read; todos los roles pueden consultar.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supplier'
                  links:
                    type: object
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - *id001
      - *id002
      - *id003
  /tenders/{tender}/invitations:
    get:
      operationId: listInvitations
      summary: Consultar invitaciones
      tags:
      - RFQ
      description: ' Requiere rfq:read; todos los roles pueden consultar.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
    post:
      operationId: inviteSuppliers
      summary: Invitar proveedores
      tags:
      - RFQ
      description: Sólo draft y deadline futuro. Un lote es atómico. Proveedor activo vinculado a la organización
        y contacto opcional del mismo proveedor. Retorna 200 tanto al crear como al repetir; existentes permanecen
        sin cambios, sin duplicar auditoría. Duplicados dentro del mismo lote son 422. No envía emails ni genera
        tokens del portal. Requiere rfq:read y rfq:write y rol owner/admin/operator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteSuppliers'
  /tenders/{tender}/publish:
    post:
      operationId: publishTender
      summary: Publicar RFQ
      tags:
      - RFQ
      description: Sólo draft. Exige deadline futuro, al menos un ítem y una invitación. Todas las invitaciones
        deben estar pending, vigentes y asociadas a proveedores/vínculos activos. Transacción con lock de RFQ, historial,
        auditoría y outbox. No envía comunicaciones. Repetir retorna 409 sin duplicar eventos. Requiere rfq:read
        y rfq:write y rol owner/admin/operator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tender'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Tender'
  /health:
    get:
      operationId: getHealth
      summary: Liveness de aplicación
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: bidflow
                required:
                - status
                - service
  /portal/auth/login:
    post:
      operationId: supplierLogin
      summary: Autenticar identidad proveedor
      tags:
      - Portal proveedor
      description: Cuenta separada del comprador. email/password; tokens Sanctum con hash, 8 horas. Sin registro
        público. Credenciales incorrectas => 422; rate limit => 429.
      parameters: []
      responses:
        '200':
          description: Token proveedor
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: &id004
                    type: string
                  token_type:
                    const: Bearer
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado incompatible o clave reutilizada con otros datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación o capacidad insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password: *id004
              required:
              - email
              - password
  /portal/auth/logout:
    post:
      operationId: supplierLogout
      summary: Revocar token proveedor actual
      tags:
      - Portal proveedor
      responses:
        '204':
          description: Revocado
        '401':
          description: No autenticado
  /portal/invitations:
    get:
      operationId: supplierInvitations
      summary: Invitaciones propias en organizaciones habilitadas
      tags:
      - Portal proveedor
      description: ''
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalInvitation'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado incompatible o clave reutilizada con otros datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación o capacidad insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /portal/{organization}/invitations/{invitation}:
    get:
      operationId: supplierInvitation
      summary: Solicitud y economía exclusivamente propia
      tags:
      - Portal proveedor
      description: Valida identidad, proveedor, organización, vínculo e invitación. No expone ofertas ajenas ni
        snapshot global de una adjudicación mixta.
      parameters:
      - $ref: '#/components/parameters/Portalorganization'
      - $ref: '#/components/parameters/Portalinvitation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortalDetail'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado incompatible o clave reutilizada con otros datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación o capacidad insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /portal/{organization}/invitations/{invitation}/bid:
    put:
      operationId: saveSupplierBid
      summary: Crear o reemplazar borrador parcial
      tags:
      - Portal proveedor
      description: Una oferta por proveedor/RFQ. Sólo published y deadlines futuros. Las líneas reemplazan íntegramente
        el borrador. Moneda ARS de Tender. Cantidad <= solicitada. Subtotal half-up a 2 decimales; total suma subtotales.
      parameters:
      - $ref: '#/components/parameters/Portalorganization'
      - $ref: '#/components/parameters/Portalinvitation'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bid'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado incompatible o clave reutilizada con otros datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación o capacidad insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 'Reintento: mismo recurso, sin duplicar efectos'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBid'
  /portal/{organization}/invitations/{invitation}/bid/submit:
    post:
      operationId: submitSupplierBid
      summary: Presentar borrador y congelar snapshot
      tags:
      - Portal proveedor
      description: Sin body. Exige borrador guardado con líneas. Reintentar presentación retorna la misma oferta,
        sin duplicar auditoría; no permite editar una oferta presentada.
      parameters:
      - $ref: '#/components/parameters/Portalorganization'
      - $ref: '#/components/parameters/Portalinvitation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bid'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado incompatible o clave reutilizada con otros datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación o capacidad insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tenders/{tender}/evaluation:
    get:
      operationId: evaluateTender
      summary: Comparativa por ítem y proveedor
      tags:
      - Evaluación y adjudicación
      description: Sólo ofertas presentadas/aceptadas. Incluye pendientes y disponibilidad ofertada. Viewer puede
        consultar.
      parameters:
      - $ref: '#/components/parameters/Tender'
      - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Evaluation'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso ajeno o inexistente
          content:
            application/json:
