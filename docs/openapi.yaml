      summary: Adjudicar cantidades a múltiples proveedores
      tags:
      - Evaluación y adjudicación
      description: 'Sólo closed/partially_awarded, rol de escritura. Tender bloqueado en transacción. Límites acumulados
        por solicitado y ofertado. Precio adjudicado explícito; snapshots inmutables. Una orden por proveedor/operación.
        partially_awarded si quedan pendientes, awarded si todos llegan a cero. Misma clave y payload: mismo recurso;
        payload distinto: 409. Rollback completo ante error.'
      parameters:
      - $ref: '#/components/parameters/Tender'
      - $ref: '#/components/parameters/Organization'
