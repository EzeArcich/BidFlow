name: bidflow
x-app: &app
  build: { context: ., dockerfile: docker/php/Dockerfile }
  image: bidflow-app:local
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /var/www/html
  environment:
    XDG_CONFIG_HOME: /tmp/bidflow/config
    XDG_DATA_HOME: /tmp/bidflow/data
  volumes: [".:/var/www/html"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  app:
    <<: *app
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bidflow
      POSTGRES_USER: bidflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bidflow_local}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-testing.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidflow -d bidflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
volumes:
  pgdata:
  redisdata:
