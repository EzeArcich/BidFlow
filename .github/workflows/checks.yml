name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bidflow_testing
          POSTGRES_USER: bidflow
          POSTGRES_PASSWORD: bidflow_testing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidflow -d bidflow_testing"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bidflow_testing
      DB_USERNAME: bidflow
      DB_PASSWORD: bidflow_testing
      BIDDING_DEMO_ENABLED: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, intl, mbstring, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: docker compose config --quiet
